<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - The AJCE Archive</title>
    <meta name="description" content="Admin dashboard for managing the AJCE Archive library system">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Main Archive Theme -->
    <link rel="stylesheet" href="library css/style (1).css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Courier+Prime&display=swap" rel="stylesheet">

    <style>
        /* ═══════════════════════════════════════════════════
           ADMIN DASHBOARD — Premium Dark Academia Styles
           ═══════════════════════════════════════════════════ */

        .admin-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .admin-header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem;
            background: rgba(42, 36, 31, 0.8);
            border: var(--border-ornate);
            border-radius: 12px;
            box-shadow: var(--shadow-deep);
        }

        .admin-header h1 {
            font-family: var(--font-heading);
            color: var(--accent-gold);
            font-size: 2rem;
            margin-bottom: 0.5rem;
            letter-spacing: 3px;
        }

        .admin-header p {
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-size: 1.1rem;
        }

        /* Stats Cards */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(42, 36, 31, 0.9), rgba(18, 16, 14, 0.9));
            border: var(--border-ornate);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(197, 160, 89, 0.15);
        }

        .stat-card .stat-number {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            color: var(--accent-gold);
            font-weight: 700;
        }

        .stat-card .stat-label {
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-size: 1rem;
            margin-top: 0.3rem;
        }

        /* Tabs */
        .tab-bar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(197, 160, 89, 0.2);
            padding-bottom: 0.5rem;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            font-family: var(--font-heading);
            font-size: 0.95rem;
            padding: 0.6rem 1.5rem;
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .tab-btn:hover {
            color: var(--accent-gold-hover);
            background: rgba(197, 160, 89, 0.08);
        }

        .tab-btn.active {
            color: var(--accent-gold);
            border: var(--border-ornate);
            border-bottom-color: var(--bg-dark);
            background: rgba(42, 36, 31, 0.6);
        }

        /* Admin Sections */
        .admin-section {
            display: none;
            animation: fadeInSection 0.4s ease;
        }

        .admin-section.active {
            display: block;
        }

        @keyframes fadeInSection {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tables */
        .admin-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: rgba(42, 36, 31, 0.6);
            border: var(--border-ornate);
            border-radius: 12px;
            overflow: hidden;
        }

        .admin-table thead th {
            background: rgba(197, 160, 89, 0.12);
            color: var(--accent-gold);
            font-family: var(--font-heading);
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 1rem;
            border-bottom: var(--border-ornate);
        }

        .admin-table tbody td {
            padding: 0.85rem 1rem;
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 1rem;
            border-bottom: 1px solid rgba(197, 160, 89, 0.08);
            vertical-align: middle;
        }

        .admin-table tbody tr:hover {
            background: rgba(197, 160, 89, 0.05);
        }

        .admin-table tbody tr:last-child td {
            border-bottom: none;
        }

        /* Premium Buttons */
        .btn-premium-action {
            font-family: var(--font-heading);
            font-size: 0.75rem;
            letter-spacing: 1px;
            padding: 0.4rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .btn-delete {
            background: var(--accent-crimson);
            color: var(--text-primary);
        }

        .btn-delete:hover {
            background: var(--accent-crimson-hover);
            box-shadow: 0 4px 15px rgba(107, 45, 40, 0.4);
        }

        .btn-add {
            background: var(--accent-gold);
            color: var(--bg-dark);
            font-weight: 700;
            padding: 0.6rem 2rem;
            font-size: 0.85rem;
        }

        .btn-add:hover {
            background: var(--accent-gold-hover);
            box-shadow: 0 4px 20px rgba(197, 160, 89, 0.3);
        }

        /* Add Book Form */
        #add-book-form {
            display: none;
            background: rgba(42, 36, 31, 0.8);
            border: var(--border-ornate);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            animation: fadeInSection 0.3s ease;
        }

        #add-book-form label {
            color: var(--accent-gold);
            font-family: var(--font-heading);
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        #add-book-form input,
        #add-book-form textarea {
            background: rgba(18, 16, 14, 0.8);
            border: 1px solid rgba(197, 160, 89, 0.2);
            color: var(--text-primary);
            font-family: var(--font-body);
            border-radius: 8px;
            padding: 0.6rem;
        }

        #add-book-form input:focus,
        #add-book-form textarea:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 8px rgba(197, 160, 89, 0.2);
            outline: none;
        }

        /* Back Link */
        .admin-back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-family: var(--font-heading);
            font-size: 0.85rem;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            transition: color 0.3s ease;
        }

        .admin-back-link:hover {
            color: var(--accent-gold);
        }

        .text-center {
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="admin-wrapper">
        <!-- Back Link -->
        <a href="index.html" class="admin-back-link">↤ Return to Archive</a>

        <!-- Header -->
        <div class="admin-header">
            <h1>Archive Administration</h1>
            <p>Manage scholars, tomes, and the sanctum's records.</p>
            <button onclick="handleLogout()" class="btn-premium-action btn-delete" style="margin-top: 1rem;">
                Exit Admin Panel
            </button>
        </div>

        <!-- Stats Row -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-number" id="stat-users">—</div>
                <div class="stat-label">Scholars Enrolled</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-books">—</div>
                <div class="stat-label">Tomes in Archive</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-reservations">—</div>
                <div class="stat-label">Active Reservations</div>
            </div>
        </div>

        <!-- Tab Bar -->
        <div class="tab-bar">
            <button class="tab-btn active" onclick="showTab('users-section', this)">Scholars</button>
            <button class="tab-btn" onclick="showTab('books-section', this)">Books</button>
        </div>

        <!-- Users Section -->
        <div id="users-section" class="admin-section active">
            <table id="users-table" class="admin-table">
                <thead>
                    <tr>
                        <th>ID No.</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="5" style="text-align:center;">Loading...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Books Section -->
        <div id="books-section" class="admin-section">
            <div style="margin-bottom: 1rem;">
                <button class="btn-premium-action btn-add" onclick="toggleBookForm()">+ Add New Book</button>
            </div>

            <!-- Add Book Form (hidden by default) -->
            <div id="add-book-form">
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="book-title">Title</label>
                        <input type="text" id="book-title" class="form-control" placeholder="Book title">
                    </div>
                    <div class="col-md-6">
                        <label for="book-author">Author</label>
                        <input type="text" id="book-author" class="form-control" placeholder="Author name">
                    </div>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label for="book-genre">Genre</label>
                        <input type="text" id="book-genre" class="form-control" placeholder="Genre">
                    </div>
                    <div class="col-md-4">
                        <label for="book-stock">Stock</label>
                        <input type="number" id="book-stock" class="form-control" placeholder="Qty" value="1">
                    </div>
                    <div class="col-md-4">
                        <label for="book-image">Image Path</label>
                        <input type="text" id="book-image" class="form-control" placeholder="images/IMG-20260316-WA0045.jpg">
                    </div>
                </div>
                <div class="mb-3">
                    <label for="book-summary">Summary</label>
                    <textarea id="book-summary" class="form-control" rows="3" placeholder="Brief description"></textarea>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn-premium-action btn-add" onclick="addBook()">Save Book</button>
                    <button class="btn-premium-action btn-delete" onclick="toggleBookForm()">Cancel</button>
                </div>
            </div>

            <table id="books-table" class="admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Stock</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="5" style="text-align:center;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Load stats on page load -->
    <script>
        // Check admin auth
        (function() {
            const role = localStorage.getItem('userRole');
            if (role !== 'admin') {
                alert('Access denied. Admin privileges required.');
                window.location.href = 'login.html';
            }
        })();

        // Load stats
        async function loadStats() {
            try {
                const response = await fetch('api.php?action=stats');
                const result = await response.json();
                if (result.success) {
                    document.getElementById('stat-users').textContent = result.userCount || 0;
                    document.getElementById('stat-books').textContent = result.bookCount || 0;
                    document.getElementById('stat-reservations').textContent = result.resCount || 0;
                }
            } catch (err) {
                console.error('Stats load failed:', err);
            }
        }

        // Tab switching
        function showTab(tabId, btn) {
            document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        // Logout
        function handleLogout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        // Load stats on page load
        document.addEventListener('DOMContentLoaded', loadStats);
    </script>

    <!-- Admin CRUD logic -->
    <script src="Javascript/admin.js"></script>
</body>

</html>
